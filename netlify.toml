[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# ====================================================================
# SEO & Security Headers for All Pages
# ====================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively for Core Web Vitals (LCP/CLS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# llms.txt and humans.txt should be plain text
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Sitemap and robots.txt caching
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ====================================================================
# API rewrites to Netlify Functions for secure payment architecture
# ====================================================================
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/razorpay-webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200

# Allow direct static file downloads (.apk, .pdf, .mp4, images) without SPA rewrite
[[redirects]]
  from = "/*.apk"
  to = "/:splat.apk"
  status = 200
  force = true

[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200

# SPA catch-all fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
