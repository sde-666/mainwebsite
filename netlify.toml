[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# API rewrites to Netlify Functions for secure payment architecture
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/razorpay-webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200

# Allow direct static file downloads (.apk, .pdf, .mp4, images) without SPA rewrite
[[redirects]]
  from = "/*.apk"
  to = "/:splat.apk"
  status = 200
  force = true

[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200

# SPA catch-all fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
