<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient for App Header -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193CB8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Avatar Gradient -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- App Canvas Background -->
  <rect width="400" height="860" fill="#F8FAFC" rx="36" />

  <!-- App Top Header Area -->
  <path d="M 0 36 Q 0 0 36 0 L 364 0 Q 400 0 400 36 L 400 240 Q 300 270 200 260 Q 100 250 0 240 Z" fill="url(#headerGrad)" />

  <!-- Decorative circles in header -->
  <circle cx="340" cy="90" r="60" fill="white" fill-opacity="0.08" />
  <circle cx="70" cy="140" r="45" fill="white" fill-opacity="0.05" />

  <!-- Status Bar (9:33 & Icons) -->
  <text x="32" y="24" fill="white" font-size="12" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">9:33</text>
  <g fill="white" transform="translate(310, 14)">
    <path d="M0 8 h4 v2 h-4 z M5 6 h4 v4 h-4 z M10 4 h4 v6 h-4 z M15 1 h4 v9 h-4 z" opacity="0.9" />
    <!-- Battery -->
    <rect x="52" y="1" width="18" height="9" rx="2" fill="none" stroke="white" stroke-width="1.2" />
    <rect x="54" y="3" width="12" height="5" rx="1" fill="white" />
    <rect x="71" y="4" width="2" height="3" rx="0.5" fill="white" />
  </g>

  <!-- Brand Logo & Header Icons -->
  <g transform="translate(24, 52)">
    <text x="0" y="24" fill="white" font-size="28" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.5">
      Skill<tspan fill="#EF4444">.</tspan><tspan fill="#F87171">py</tspan>
    </text>
    <text x="2" y="42" fill="white" font-size="12" font-style="italic" font-family="Georgia, serif" opacity="0.85">
      Just learn skills...
    </text>

    <!-- Top Right Actions (Notification Bell & Moon) -->
    <g transform="translate(290, 8)">
      <circle cx="14" cy="14" r="16" fill="white" fill-opacity="0.15" />
      <path d="M14 6 C11 6 9 8 9 11 L9 16 L7 18 L21 18 L19 16 L19 11 C19 8 17 6 14 6 Z M12.5 19 C12.5 19.8 13.2 20.5 14 20.5 C14.8 20.5 15.5 19.8 15.5 19 Z" fill="white" />
      
      <!-- Moon Icon -->
      <path d="M46 7 A8 8 0 1 0 54 18 A7 7 0 0 1 46 7 Z" fill="white" />
    </g>
  </g>

  <!-- User Greeting Row -->
  <g transform="translate(24, 126)">
    <!-- Avatar -->
    <circle cx="22" cy="22" r="22" fill="url(#avatarGrad)" />
    <text x="22" y="28" fill="white" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">A</text>
    
    <!-- Greeting Text -->
    <text x="56" y="15" fill="white" fill-opacity="0.8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Good Evening 👋</text>
    <text x="56" y="33" fill="white" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Aditya Pathak</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(20, 184)" filter="url(#softShadow)">
    <rect width="360" height="48" rx="24" fill="white" />
    <circle cx="28" cy="24" r="7" fill="none" stroke="#94A3B8" stroke-width="2" />
    <line x1="33" y1="29" x2="40" y2="36" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <text x="52" y="29" fill="#94A3B8" font-size="13" font-family="system-ui, -apple-system, sans-serif">Search Courses, Chapters or Notes...</text>
  </g>

  <!-- CARD 1: Announcement Card -->
  <g transform="translate(20, 275)" filter="url(#softShadow)">
    <rect width="360" height="120" rx="20" fill="#E0F2FE" />
    <rect x="18" y="16" width="105" height="22" rx="6" fill="#1D4ED8" />
    <text x="26" y="31" fill="white" font-size="10" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">ANNOUNCEMENT</text>
    
    <text x="18" y="64" fill="#0F172A" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Skilldotpy</text>
    <text x="18" y="84" fill="#475569" font-size="11.5" font-family="system-ui, -apple-system, sans-serif">Access 100% chapter-wise notes,</text>
    <text x="18" y="99" fill="#475569" font-size="11.5" font-family="system-ui, -apple-system, sans-serif">handwritten PDFs, and HD video</text>

    <!-- Megaphone Icon in Blue Circle -->
    <circle cx="310" cy="60" r="26" fill="#2563EB" />
    <path d="M302 55 L314 49 L314 71 L302 65 Z M300 58 L302 58 L302 62 L300 62 Z M316 53 C319 55 321 57 321 60 C321 63 319 65 316 67" fill="white" />
  </g>

  <!-- SECTION 2: Continue Learning -->
  <g transform="translate(20, 420)">
    <text x="4" y="14" fill="#0F172A" font-size="16" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Continue Learning</text>
    
    <g transform="translate(0, 26)" filter="url(#softShadow)">
      <rect width="360" height="74" rx="18" fill="white" />
      
      <!-- Python Code Icon Badge -->
      <rect x="14" y="13" width="48" height="48" rx="14" fill="#059669" />
      <text x="38" y="42" fill="white" font-size="16" font-weight="900" text-anchor="middle" font-family="monospace">&lt; &gt;</text>
      
      <!-- Text Info -->
      <text x="74" y="32" fill="#0F172A" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Python Programming</text>
      <text x="74" y="49" fill="#64748B" font-size="11" font-family="system-ui, -apple-system, sans-serif">Pick up where you left off</text>

      <!-- Play Button -->
      <circle cx="324" cy="37" r="16" fill="#2563EB" />
      <polygon points="320,30 331,37 320,44" fill="white" />
    </g>
  </g>

  <!-- SECTION 3: Featured Courses -->
  <g transform="translate(20, 550)">
    <text x="4" y="14" fill="#0F172A" font-size="16" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Featured Courses</text>
    <text x="356" y="14" fill="#2563EB" font-size="12" font-weight="bold" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">View All</text>

    <!-- Card 1: CCC Course -->
    <g transform="translate(0, 26)" filter="url(#softShadow)">
      <rect width="250" height="175" rx="18" fill="white" />
      
      <!-- Course Thumbnail -->
      <rect width="250" height="98" rx="18" fill="#094A58" />
      <!-- Binary Matrix code decor -->
      <text x="14" y="35" fill="#10B981" font-size="10" font-family="monospace" opacity="0.35">01001011 11010010</text>
      <text x="14" y="55" fill="#10B981" font-size="10" font-family="monospace" opacity="0.35">10110100 00101101</text>
      
      <!-- Monitor Icon & Chapters -->
      <rect x="14" y="24" width="34" height="34" rx="8" fill="white" fill-opacity="0.2" />
      <text x="56" y="46" fill="white" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">3 Chapters</text>

      <!-- Price Tag -->
      <rect x="186" y="20" width="50" height="24" rx="12" fill="#7C3AED" />
      <text x="211" y="36" fill="white" font-size="11" font-weight="900" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">₹99</text>

      <!-- Course Details -->
      <text x="14" y="124" fill="#0F172A" font-size="12.5" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">CCC (Computer Concepts)</text>
      <text x="14" y="142" fill="#64748B" font-size="10" font-family="system-ui, -apple-system, sans-serif">Master Govt. CCC exam concepts, MS</text>
      <text x="14" y="156" fill="#64748B" font-size="10" font-family="system-ui, -apple-system, sans-serif">Office, LibreOffice, and Digital Finan...</text>
    </g>

    <!-- Card 2: LibreOffice (partial) -->
    <g transform="translate(262, 26)">
      <rect width="100" height="175" rx="18" fill="white" stroke="#E2E8F0" />
      <rect width="100" height="98" rx="18" fill="#1E293B" />
      <text x="10" y="124" fill="#0F172A" font-size="12" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Libre Off...</text>
      <text x="10" y="142" fill="#64748B" font-size="9.5" font-family="system-ui, -apple-system, sans-serif">Writer, Calc...</text>
    </g>
  </g>

  <!-- BOTTOM NAVIGATION BAR -->
  <g transform="translate(0, 785)">
    <rect width="400" height="75" fill="#FAF5FF" />
    <line x1="0" y1="0" x2="400" y2="0" stroke="#F1F5F9" stroke-width="1" />

    <!-- Tab 1: Home (Active) -->
    <g transform="translate(30, 10)">
      <rect x="0" y="0" width="60" height="30" rx="15" fill="#EDE9FE" />
      <path d="M30 6 L20 14 L23 14 L23 23 L37 23 L37 14 L40 14 Z" fill="#1E1B4B" />
      <text x="30" y="44" fill="#1E1B4B" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Home</text>
    </g>

    <!-- Tab 2: Courses -->
    <g transform="translate(170, 12)">
      <!-- Graduation Cap -->
      <polygon points="30,8 14,16 30,24 46,16" fill="#64748B" />
      <path d="M19 19 L19 26 Q30 30 41 26 L41 19" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="30" y="42" fill="#64748B" font-size="10" font-weight="semibold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Courses</text>
    </g>

    <!-- Tab 3: Profile -->
    <g transform="translate(310, 12)">
      <circle cx="30" cy="14" r="5" fill="#64748B" />
      <path d="M20 28 C20 23 25 21 30 21 C35 21 40 23 40 28 Z" fill="#64748B" />
      <text x="30" y="42" fill="#64748B" font-size="10" font-weight="semibold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Profile</text>
    </g>
  </g>
</svg>
